<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <form action="">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname">
        
        <label for="contactNumber">Contact Number:</label>
        <input type="tel" id="contactNumber" name="contactNumber">
        
        <label for="address">Address:</label>
        <textarea id="address" name="address" rows="4" cols="50"></textarea>

        <label for="companyName">Company Name:</label>
        <input type="text" id="companyName" name="companyName">

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email">

        <label for="department">Department:</label>
        <select id="department" name="department">
            <option value="hr">HR</option>
            <option value="sales">Sales</option>
            <option value="development">Development</option>
            <option value="marketing">Marketing</option>
            <option value="others">Others</option>
        </select>
        <div class="gender">
            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label><br>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br>

            <input type="radio" id="preferNotToSay" name="gender" value="prefer_not_to_say">
            <label for="preferNotToSay">Prefer not to say</label>
        </div>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
